plugins {
    id 'com.android.library' version '8.13.2'
    id 'maven-publish'
}

def libVersion = System.getenv("VERSION") ?: "0.0.1"

android {
    namespace = "com.loonybot.turborc"
    compileSdk = 30

    defaultConfig {
        minSdk = 24
        targetSdk = 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    api "org.firstinspires.ftc:RobotCore:12.0.0"
    implementation "androidx.annotation:annotation:1.1.0"
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = "com.github.Loonybot"
                artifactId = "TurboRC"
                version = libVersion
            }
        }
    }
}
